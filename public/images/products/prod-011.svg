<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="metalStand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Ambient Glow Behind Monitor -->
  <ellipse cx="400" cy="260" rx="360" ry="180" fill="url(#screenGlow)" filter="url(#glow)"/>

  <!-- Grid floor reflection -->
  <g opacity="0.15">
    <path d="M 0 520 L 800 520 M 0 540 L 800 540 M 0 565 L 800 565 M 0 595 L 800 595" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 100 600 L 320 500 M 250 600 L 360 500 M 400 600 L 400 500 M 550 600 L 440 500 M 700 600 L 480 500" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Monitor Stand Base -->
  <ellipse cx="400" cy="490" rx="140" ry="18" fill="url(#metalStand)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="400" cy="488" rx="120" ry="12" fill="#0f172a" opacity="0.6"/>

  <!-- Stand Stem -->
  <polygon points="388,485 412,485 408,300 392,300" fill="url(#metalStand)" stroke="#475569" stroke-width="1.5"/>

  <!-- Curved Screen Outer Bezel -->
  <!-- Subtle arc simulating 1800R curve -->
  <g>
    <!-- Screen Shadow -->
    <path d="M 80 120 Q 400 135 720 120 L 710 395 Q 400 410 90 395 Z" fill="#020617" opacity="0.8" filter="url(#glow)"/>

    <!-- Outer Frame -->
    <path d="M 75 115 Q 400 132 725 115 L 715 405 Q 400 422 85 405 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>

    <!-- OLED Screen Area -->
    <path d="M 85 125 Q 400 140 715 125 L 705 395 Q 400 410 95 395 Z" fill="url(#screenGrad)"/>

    <!-- Screen UI Elements / Graphics -->
    <!-- Curved Horizon lines & abstract landscape -->
    <path d="M 85 280 Q 400 220 705 320 L 705 395 Q 400 410 95 395 Z" fill="#090d16" opacity="0.75"/>
    <path d="M 120 330 Q 300 250 480 340 T 705 310" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 95 360 Q 350 280 550 350 T 705 330" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Screen Glow Highlights -->
    <ellipse cx="380" cy="200" rx="90" ry="30" fill="#ffffff" opacity="0.18" transform="rotate(-5 380 200)"/>

    <!-- Bottom Bezel Chin & Logo -->
    <path d="M 85 395 Q 400 410 705 395 L 708 404 Q 400 419 82 404 Z" fill="#1e293b"/>
    <circle cx="400" cy="410" r="3" fill="#38bdf8"/>
  </g>

  <!-- Spec Badges on Canvas -->
  <g transform="translate(60, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">34" QD-OLED • 175Hz</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c084fc">0.03ms • 99% DCI-P3</text>
  </g>
</svg>
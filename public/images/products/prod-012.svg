<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="earbudsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="budBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#earbudsBg)"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="300" rx="340" ry="220" fill="url(#auroraGlow)"/>

  <!-- Shadow below charging case -->
  <ellipse cx="400" cy="470" rx="190" ry="25" fill="#020617" opacity="0.8"/>

  <!-- Charging Case (Opened, angled perspective) -->
  <g transform="translate(400, 390)">
    <!-- Case Base -->
    <rect x="-140" y="-30" width="280" height="100" rx="50" fill="url(#caseGrad)" stroke="#475569" stroke-width="2.5"/>
    <!-- Lid Interior Cutout -->
    <ellipse cx="0" cy="-28" rx="125" ry="38" fill="#090d16" stroke="#334155" stroke-width="1.5"/>

    <!-- Dual Pod Docks (Left & Right) -->
    <ellipse cx="-55" cy="-25" rx="38" ry="22" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <ellipse cx="55" cy="-25" rx="38" ry="22" fill="#020617" stroke="#1e293b" stroke-width="2"/>

    <!-- Golden Charging Contact Pins -->
    <circle cx="-62" cy="-25" r="3" fill="#eab308"/>
    <circle cx="-48" cy="-25" r="3" fill="#eab308"/>
    <circle cx="48" cy="-25" r="3" fill="#eab308"/>
    <circle cx="62" cy="-25" r="3" fill="#eab308"/>

    <!-- Case Status LED Indicator -->
    <circle cx="0" cy="25" r="4" fill="#10b981"/>
    <circle cx="0" cy="25" r="8" fill="#10b981" opacity="0.35"/>
  </g>

  <!-- Left Earbud (Floating, Front Angle) -->
  <g transform="translate(260, 200) rotate(-15)">
    <!-- Stem Drop Shadow -->
    <rect x="-18" y="45" width="28" height="95" rx="14" fill="#000" opacity="0.4"/>
    <!-- Earbud Stem -->
    <rect x="-14" y="40" width="28" height="95" rx="14" fill="url(#budBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="0" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-6" y="120" width="12" height="6" rx="2" fill="#334155"/>

    <!-- Earbud Head -->
    <ellipse cx="0" cy="30" rx="34" ry="30" fill="url(#budBody)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Silicone Ear Tip (angled) -->
    <ellipse cx="24" cy="20" rx="20" ry="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="28" cy="20" rx="9" ry="8" fill="#475569"/>

    <!-- ANC Mesh Vent -->
    <ellipse cx="-16" cy="26" rx="6" ry="10" fill="#334155"/>
  </g>

  <!-- Right Earbud (Floating, Side Angle) -->
  <g transform="translate(530, 195) rotate(18)">
    <!-- Stem Drop Shadow -->
    <rect x="-10" y="45" width="28" height="95" rx="14" fill="#000" opacity="0.4"/>
    <!-- Earbud Stem -->
    <rect x="-14" y="40" width="28" height="95" rx="14" fill="url(#budBody)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="0" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="-6" y="120" width="12" height="6" rx="2" fill="#334155"/>

    <!-- Earbud Head -->
    <ellipse cx="0" cy="30" rx="34" ry="30" fill="url(#budBody)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Silicone Ear Tip (angled) -->
    <ellipse cx="-24" cy="20" rx="20" ry="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="-28" cy="20" rx="9" ry="8" fill="#475569"/>

    <!-- ANC Mesh Vent -->
    <ellipse cx="16" cy="26" rx="6" ry="10" fill="#334155"/>
  </g>

  <!-- Audio Waves Graphic -->
  <g stroke="#818cf8" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 170 180 Q 200 130 240 160"/>
    <path d="M 150 160 Q 190 95 240 140"/>
    <path d="M 560 160 Q 610 95 650 160"/>
    <path d="M 560 140 Q 610 75 670 140"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 50)">
    <rect width="180" height="34" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Adaptive ANC • 42dB</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">36h Total Battery Life</text>
  </g>
</svg>

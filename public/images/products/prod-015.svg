<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="titaniumRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="bioGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ringBg)"/>
  <ellipse cx="400" cy="300" rx="340" ry="240" fill="url(#bioGlow)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="400" cy="480" rx="190" ry="22" fill="#000000" opacity="0.8"/>

  <!-- Pedestal Disc Base -->
  <ellipse cx="400" cy="460" rx="140" ry="20" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="400" cy="455" rx="110" ry="14" fill="#020617"/>

  <!-- Smart Ring Graphic (Angled 3D Isometric View) -->
  <g transform="translate(400, 310)">
    <!-- Outer Titanium Ring Shell (Thick Wall) -->
    <!-- Outer Ellipse -->
    <ellipse cx="0" cy="0" rx="150" ry="95" fill="none" stroke="url(#titaniumRing)" stroke-width="38"/>
    <!-- Outer Rim Highlight -->
    <ellipse cx="0" cy="-6" rx="148" ry="93" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>

    <!-- Inner Core Resin Layer -->
    <ellipse cx="0" cy="0" rx="112" ry="65" fill="#06121e" stroke="#10b981" stroke-width="2.5"/>

    <!-- Green Photoplethysmography (PPG) Sensors on Inner Ring Wall -->
    <!-- Sensor Node 1 -->
    <circle cx="-50" cy="40" r="7" fill="#10b981"/>
    <circle cx="-50" cy="40" r="14" fill="#10b981" opacity="0.3"/>
    <!-- Sensor Node 2 (Center) -->
    <circle cx="0" cy="55" r="9" fill="#10b981"/>
    <circle cx="0" cy="55" r="18" fill="#10b981" opacity="0.4"/>
    <!-- Sensor Node 3 -->
    <circle cx="50" cy="40" r="7" fill="#10b981"/>
    <circle cx="50" cy="40" r="14" fill="#10b981" opacity="0.3"/>

    <!-- Red Infrared SpO2 Sensor Node -->
    <circle cx="0" cy="-52" r="6" fill="#ef4444"/>
    <circle cx="0" cy="-52" r="12" fill="#ef4444" opacity="0.3"/>

    <!-- Bio Pulse Waveform Glowing inside -->
    <path d="M -70 0 Q -50 -25 -30 0 T 0 -35 T 25 20 T 50 -10 T 70 0" fill="none" stroke="#34d399" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 50)">
    <rect width="180" height="34" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Aerospace Titanium</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="34" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Sleep & HRV Tracking</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="standBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="carbonPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="metalHinge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="standGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#standBg)"/>
  <ellipse cx="400" cy="310" rx="330" ry="220" fill="url(#standGlow)"/>

  <!-- Ground Drop Shadow -->
  <ellipse cx="400" cy="490" rx="230" ry="25" fill="#000000" opacity="0.75"/>

  <!-- Laptop Stand Graphics (3D Perspective Riser) -->
  <g transform="translate(400, 310)">
    <!-- Bottom Heavy Metal Base -->
    <polygon points="-180,140 180,140 140,170 -140,170" fill="url(#metalHinge)" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="0" cy="155" rx="130" ry="8" fill="#0f172a"/>

    <!-- Dual Heavy Support Arms (Z-Shape Ergonomic Hinges) -->
    <!-- Left Arm -->
    <polygon points="-120,140 -105,140 -90,0 -105,0" fill="url(#metalHinge)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-112" cy="140" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="-98" cy="0" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Right Arm -->
    <polygon points="105,140 120,140 105,0 90,0" fill="url(#metalHinge)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="112" cy="140" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="98" cy="0" r="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Top Plate (Angled Laptop Tray with Honeycomb Cooling Cutouts) -->
    <!-- Angled Tray -->
    <polygon points="-210,-120 210,-120 160,20 -160,20" fill="url(#carbonPlate)" stroke="#475569" stroke-width="2.5"/>

    <!-- Dual Front Retention Hooks (Stops laptop from sliding) -->
    <path d="M -140 20 L -140 4 Q -140 -4 -130 -4 L -115 -4" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <path d="M 115 -4 L 130 -4 Q 140 -4 140 4 L 140 20" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

    <!-- Ventilation Cutout Slots in Carbon Tray -->
    <g fill="#020617" stroke="#334155" stroke-width="1.5">
      <rect x="-130" y="-80" width="40" height="70" rx="6"/>
      <rect x="-70" y="-85" width="40" height="75" rx="6"/>
      <rect x="-10" y="-85" width="20" height="75" rx="6"/>
      <rect x="30" y="-85" width="40" height="75" rx="6"/>
      <rect x="90" y="-80" width="40" height="70" rx="6"/>
    </g>

    <!-- Teal Accent Airflow Indicator -->
    <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <path d="M -50 -130 Q -50 -150 -30 -160"/>
      <path d="M 0 -135 Q 0 -155 20 -165"/>
      <path d="M 50 -130 Q 50 -150 70 -160"/>
    </g>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">CNC Aluminum & Carbon</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Infinite Angle Riser</text>
  </g>
</svg>

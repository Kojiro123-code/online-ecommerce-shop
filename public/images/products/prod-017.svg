<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="droneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="droneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="droneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#droneBg)"/>
  <ellipse cx="400" cy="300" rx="350" ry="240" fill="url(#droneGlow)"/>

  <!-- Drone Ground Shadow -->
  <ellipse cx="400" cy="500" rx="200" ry="26" fill="#000000" opacity="0.8"/>

  <!-- Quadcopter Drone (Hovering 3D Front Angle) -->
  <g transform="translate(400, 310)">
    <!-- 4 Folding Rotor Arms -->
    <!-- Front Left Arm -->
    <line x1="0" y1="0" x2="-210" y2="-90" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Front Right Arm -->
    <line x1="0" y1="0" x2="210" y2="-90" stroke="#334155" stroke-width="14" stroke-linecap="round"/>
    <!-- Rear Left Arm -->
    <line x1="0" y1="0" x2="-180" y2="70" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <!-- Rear Right Arm -->
    <line x1="0" y1="0" x2="180" y2="70" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>

    <!-- 4 Brushless Motor Housings & Spinning Propeller Blur Discs -->
    <!-- Front Left Propeller Disc -->
    <ellipse cx="-210" cy="-90" rx="75" ry="18" fill="#38bdf8" opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="-210" cy="-90" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-210" cy="-90" r="4" fill="#0ea5e9"/>

    <!-- Front Right Propeller Disc -->
    <ellipse cx="210" cy="-90" rx="75" ry="18" fill="#38bdf8" opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="210" cy="-90" r="14" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="210" cy="-90" r="4" fill="#0ea5e9"/>

    <!-- Rear Left Propeller Disc -->
    <ellipse cx="-180" cy="70" rx="65" ry="16" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="-180" cy="70" r="12" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <circle cx="-180" cy="70" r="3" fill="#f59e0b"/>

    <!-- Rear Right Propeller Disc -->
    <ellipse cx="180" cy="70" rx="65" ry="16" fill="#f59e0b" opacity="0.25" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8 6"/>
    <circle cx="180" cy="70" r="12" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <circle cx="180" cy="70" r="3" fill="#f59e0b"/>

    <!-- Aerodynamic Drone Fuselage / Main Body -->
    <path d="M 0 -75 L 55 -20 L 40 60 L -40 60 L -55 -20 Z" fill="url(#droneBody)" stroke="#64748b" stroke-width="2.5"/>

    <!-- Carbon Fiber Top Canopy Texture & Power Button -->
    <path d="M 0 -55 L 35 -15 L 25 45 L -25 45 L -35 -15 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="9" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="5" r="3" fill="#10b981"/>

    <!-- Dual LED Headlights -->
    <circle cx="-28" cy="-55" r="5" fill="#f8fafc"/>
    <circle cx="-28" cy="-55" r="12" fill="#38bdf8" opacity="0.3"/>
    <circle cx="28" cy="-55" r="5" fill="#f8fafc"/>
    <circle cx="28" cy="-55" r="12" fill="#38bdf8" opacity="0.3"/>

    <!-- Front Gimbal 4K Camera Module (Hanging Under Nose) -->
    <rect x="-24" y="-95" width="48" height="34" rx="10" fill="#020617" stroke="#475569" stroke-width="2"/>
    <!-- 4K Camera Lens -->
    <circle cx="0" cy="-78" r="13" fill="#090d16" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="-78" r="8" fill="#1e1b4b"/>
    <circle cx="0" cy="-78" r="3" fill="#60a5fa"/>
    <circle cx="-3" cy="-81" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Badges -->
  <g transform="translate(60, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Sub-249g • No FAA Reg</text>
  </g>

  <g transform="translate(560, 50)">
    <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="14" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">4K HDR • 38-Min Flight</text>
  </g>
</svg>
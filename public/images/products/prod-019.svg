<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" fill="none">
  <defs>
    <!-- Cyan Neon Accent -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Deep Tech Violet / Magenta -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Dark Titanium Panels -->
    <linearGradient id="darkArmorPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Sole Gradient -->
    <linearGradient id="roboticSole" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subtle Lighting Highlights -->
    <filter id="neonReflect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Angled Sneaker (Tilted ~28° pointing toward bottom-right, matching reference image) -->
  <g transform="translate(450, 310) rotate(26) translate(-450, -310)">
    <!-- Heel Collar & Pull Ring -->
    <path d="M 230 140 L 260 70 L 305 90 L 280 160 Z" fill="#090d16" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 265 80 L 290 95" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>

    <!-- High-Top Ankle Collar Wrap -->
    <path d="M 220 170 Q 280 120 370 160 L 380 250 L 200 240 Z" fill="url(#darkArmorPlate)" stroke="#475569" stroke-width="2.5"/>
    <circle cx="235" cy="210" r="14" fill="#a855f7" filter="url(#neonReflect)" opacity="0.85"/>
    <circle cx="235" cy="210" r="7" fill="#ffffff"/>

    <!-- Cyber Lacing Architecture -->
    <path d="M 330 160 L 460 230 L 430 290 L 310 220 Z" fill="#090d16"/>
    <!-- Glowing Cyan Laces -->
    <line x1="345" y1="190" x2="385" y2="180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="370" y1="215" x2="415" y2="205" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="395" y1="240" x2="445" y2="230" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="420" y1="265" x2="475" y2="255" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Main Upper Body Shell (Angular Armored Facets) -->
    <path d="M 180 250 Q 280 235 390 260 L 610 390 Q 660 440 700 460 L 660 510 Q 520 480 400 495 L 160 440 Q 140 340 180 250 Z" 
          fill="url(#cyanGrad)" stroke="#e0f2fe" stroke-width="3"/>

    <!-- Geometric Facet Overlays (Cyber-Armor Panels) -->
    <polygon points="200,270 330,265 370,355 220,365" fill="url(#darkArmorPlate)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="340,265 460,275 490,380 380,365" fill="#090d16" stroke="#475569" stroke-width="2"/>
    <polygon points="470,285 580,380 520,430 440,370" fill="url(#darkArmorPlate)" stroke="#0284c7" stroke-width="2"/>

    <!-- Aerodynamic Sculpted Toe Cap -->
    <path d="M 580 375 L 710 460 Q 725 480 700 505 L 600 495 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 630 435 Q 675 460 690 480" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.75"/>

    <!-- Magenta Cyber Airbag Module in Midsole -->
    <g transform="translate(260, 365)">
      <polygon points="0,0 95,-15 90,48 -10,55" fill="#090d16" stroke="#a855f7" stroke-width="2.5"/>
      <rect x="20" y="8" width="55" height="24" rx="5" fill="url(#purpleGlow)" filter="url(#neonReflect)"/>
      <rect x="25" y="12" width="45" height="16" rx="3" fill="#ffffff" opacity="0.9"/>
      <!-- Glowing Power Nodes -->
      <circle cx="35" cy="20" r="3" fill="#f43f5e"/>
      <circle cx="48" cy="20" r="3" fill="#f43f5e"/>
      <circle cx="61" cy="20" r="3" fill="#f43f5e"/>
    </g>

    <!-- Robotic Modular Sole Platform -->
    <!-- Rear Outrigger Fin -->
    <polygon points="120,410 200,410 180,485 90,470" fill="url(#roboticSole)" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="90,470 150,475 130,510 60,485" fill="#020617" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Main Midsole Platform with Heavy Robotic Grip Teeth -->
    <path d="M 170 435 L 360 465 L 470 485 L 630 505 L 700 520 L 660 560 L 500 550 L 360 535 L 150 510 Z" 
          fill="url(#roboticSole)" stroke="#334155" stroke-width="3"/>

    <!-- Bottom Cleats & Tread Blocks -->
    <polygon points="170,512 240,520 225,542 155,532" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="280,526 370,535 355,556 265,546" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="440,542 540,550 525,572 425,562" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="580,552 650,560 635,580 565,572" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Cyan Circuit Line Inscription -->
    <path d="M 440 440 L 580 475" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="10 5" stroke-linecap="round"/>
    <polygon points="600,480 615,484 600,488" fill="#38bdf8"/>
  </g>
</svg>